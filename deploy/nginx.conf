server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry.js decides which version of this shell the browser loads —
    # rules/2-anexos/H-front.md, rule 4: it must never be cached, or a
    # deployed fix never reaches a browser that already fetched the old one.
    location = /remoteEntry.js {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Every other built asset is content-hashed by Vite — safe to cache
    # forever, since a changed file gets a new name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # No /api/v1/* proxy here on purpose: lms-api-gateway now exists
    # (ADR-007) and fronts this container directly (gateway's deploy/
    # nginx.conf: `location / { proxy_pass http://shell:80; }`). vite.config.ts's
    # dev-only proxy stand-in is a separate, dev-server-only concern.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
